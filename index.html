<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c0f" />
    <meta
      name="description"
      content="Operation Vanguard — a browser-native Call of Duty-style multiplayer FPS. No downloads, no plugins."
    />
    <title>Operation Vanguard</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0c0f'/%3E%3Cpath d='M16 4v24M4 16h24' stroke='%23ff7a29' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23ff7a29' stroke-width='2'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <!-- Boot screen. Replaced by the client once the engine is ready. -->
      <div id="boot">
        <div class="boot-mark">
          <span class="boot-op">OPERATION</span>
          <span class="boot-title">VANGUARD</span>
        </div>
        <div class="boot-bar"><div class="boot-bar-fill" id="boot-progress"></div></div>
        <div class="boot-status" id="boot-status">Initialising engine&hellip;</div>
        <noscript>
          <p class="boot-error">
            Operation Vanguard needs JavaScript. Please enable it and reload.
          </p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
