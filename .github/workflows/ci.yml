name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The test suite runs whole matches headlessly — bots, collision, ballistics
      # and mode rules — so a regression in gameplay fails CI, not just a unit.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # `offline/` is a committed artefact so that cloning the repository is
      # enough to play — no toolchain, no server, double-click index.html. A
      # committed build goes stale the moment somebody forgets to regenerate it,
      # and a stale one is worse than none because it looks current. The build is
      # deterministic, so rebuilding and diffing is a complete check.
      - name: Offline build is current
        run: |
          npm run build:standalone
          if ! git diff --quiet -- offline; then
            echo "::error::offline/ is out of date — run 'npm run build:standalone' and commit the result"
            git diff --stat -- offline
            exit 1
          fi
          echo "offline/ matches the source"

      - name: Report bundle size
        run: |
          echo "### Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -ah dist/assets | sort -h | tail -20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
