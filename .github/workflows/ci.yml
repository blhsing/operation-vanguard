name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate localized UI
        run: npm run check:i18n

      - name: .NET parity fixtures are current
        run: |
          npm run export:dotnet
          changes="$(git status --porcelain --untracked-files=all -- ../dotnet/parity ../dotnet/src/OperationVanguard.Core/Data)"
          if [[ -n "$changes" ]]; then
            echo "::error::.NET generated parity data is out of date — run 'npm run export:dotnet' from web/"
            echo "$changes"
            git diff --stat -- ../dotnet/parity ../dotnet/src/OperationVanguard.Core/Data/*Generated.cs
            exit 1
          fi

      # The test suite runs whole matches headlessly — bots, collision, ballistics
      # and mode rules — so a regression in gameplay fails CI, not just a unit.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Real WebSocket server round trip
        run: npm run verify:server

      # `offline/` is a committed artefact so that cloning the repository is
      # enough to play — no toolchain, no server, double-click index.html. A
      # committed build goes stale the moment somebody forgets to regenerate it,
      # and a stale one is worse than none because it looks current. The build is
      # deterministic, so rebuilding and diffing is a complete check.
      - name: Offline build is current
        run: |
          npm run build:standalone
          changes="$(git status --porcelain --untracked-files=all -- offline)"
          if [[ -n "$changes" ]]; then
            echo "::error::web/offline/ is out of date — run 'npm run build:standalone' from web/ and commit the result"
            echo "$changes"
            git diff --stat -- offline
            exit 1
          fi
          echo "offline/ matches the source"

      # The only check that opens the game the way a person does: real Chrome, a
      # `file://` URL, a match started through the menu — and then the
      # repository's own index.html, to confirm it explains itself instead of
      # hanging on the boot screen for ever.
      #
      # Its absence is the reason this kept going wrong. Every other check here
      # verifies a build; none of them opened the result. The source-entry guard
      # shipped broken and stayed broken for five milestones precisely because
      # the build asserted it was *absent* from offline/, the browser harness only
      # ever loaded offline/, and nothing anywhere looked at the file the guard
      # actually lives in. Two green checks, neither pointed at the defect.
      - name: Plays from file:// in real Chrome
        run: |
          google-chrome --version
          npm run verify:standalone

      - name: Keep the proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-match
          path: web/.verify/standalone-match.png
          if-no-files-found: warn

      - name: Report bundle size
        run: |
          echo "### Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -ah dist/assets | sort -h | tail -20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  dotnet:
    name: .NET — build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore dotnet/OperationVanguard.sln

      - name: Build
        run: dotnet build dotnet/OperationVanguard.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test dotnet/OperationVanguard.sln --configuration Release --no-build
